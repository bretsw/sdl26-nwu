“In its broadest meaning, ‘self-directed learning’ describes a process in which individuals take the initiative, with or without the help of others, in diagnosing their learning needs, formulating their learning goals, identifying human and material resources for learning, choosing and implementing appropriate learning strategies, and evaluating learning outcomes.” (Knowles, 1975, p. 18)

Knowles, M. S. (1975). *Self-directed learning: A guide for learners and teachers*. Cambridge, The Adult Education Company.
